name: Refresh package lock
on:
  push:
    branches: [foundation-v0.1]
    paths: [package.json, .github/workflows/refresh-lock.yml]
permissions: {contents: write}
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {ref: foundation-v0.1}
      - uses: actions/setup-node@v6
        with: {node-version: '22'}
      - run: npm install --package-lock-only --ignore-scripts
      - run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: generate package lock"
          git push origin HEAD:foundation-v0.1
